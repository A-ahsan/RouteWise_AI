<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RouteWise AI — Autonomous Transit Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100%; background:#e8eaed; }
    .leaflet-container { font-family: inherit; }
    .msg-fade { animation: fade .3s ease; }
    @keyframes fade { from { opacity:0; transform:translateY(6px);} to {opacity:1;transform:none;} }
    ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen overflow-hidden">
  <div class="flex h-full">
    <!-- Chat panel -->
    <aside class="w-[420px] min-w-[420px] flex flex-col border-r border-slate-800 bg-slate-900/60">
      <header class="px-5 py-4 border-b border-slate-800">
        <div class="flex items-start justify-between gap-2">
          <div>
            <h1 class="text-lg font-bold flex items-center gap-2">🚍 RouteWise <span class="text-emerald-400">AI</span></h1>
            <p class="text-xs text-slate-400 mt-0.5">Autonomous transit agent · Gemma 4</p>
          </div>
          <div id="clock" class="text-right text-[11px] leading-tight text-slate-400 bg-slate-800/70 rounded-lg px-2.5 py-1.5 whitespace-nowrap"></div>
        </div>
      </header>

      <div id="chat" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 text-sm"></div>

      <div class="px-4 pb-3">
        <div id="suggestions" class="flex flex-wrap gap-1.5 mb-2"></div>
        <div class="flex gap-2">
          <input id="input" placeholder="Where do you need to go?"
            class="flex-1 bg-slate-800 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 ring-emerald-500 placeholder:text-slate-500" />
          <button id="send" class="bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-semibold rounded-lg px-4 text-sm">Send</button>
        </div>
        <button id="reset" class="text-xs text-slate-500 hover:text-slate-300 mt-2">↻ New conversation</button>
      </div>
    </aside>

    <!-- Map -->
    <main class="flex-1 relative">
      <div id="map"></div>
      <div id="legend" class="absolute top-3 right-3 z-[500] bg-slate-900/90 backdrop-blur rounded-lg p-3 text-xs space-y-1 border border-slate-700 hidden"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
